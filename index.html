<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8fc">
  <title>오늘 뭐 하지? — 랜덤 룰렛</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20243a;
      --muted: #777d92;
      --purple: #6c56e8;
      --purple-dark: #5640d0;
      --line: #e9eaf2;
      --surface: #ffffff;
      --background: #f7f8fc;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      min-width: 320px;
      min-height: 0;
      margin: 0;
      overflow: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 0%, rgba(221, 216, 255, .45), transparent 34rem),
        var(--background);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .app {
      display: grid;
      width: min(1120px, calc(100% - 40px));
      height: 100vh;
      height: 100dvh;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: clamp(8px, 1.5vh, 16px);
      margin: 0 auto;
      padding: clamp(12px, 2.2vh, 26px) 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 11px;
      color: white;
      background: linear-gradient(145deg, #8877ff, #624be2);
      box-shadow: 0 5px 12px #6c56e84a;
      font-size: 18px;
    }

    .top-note {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .intro { margin-bottom: 0; text-align: center; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 4vw, 38px);
      font-weight: 850;
      letter-spacing: -.065em;
    }

    .intro p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.4;
    }

    .workspace {
      display: grid;
      min-height: 0;
      grid-template-columns: minmax(0, 1.32fr) minmax(300px, .78fr);
      gap: clamp(12px, 1.5vw, 20px);
      align-items: stretch;
    }

    .card {
      border: 1px solid rgba(232, 233, 242, .85);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 12px 36px rgba(34, 38, 72, .055);
    }

    .wheel-card {
      display: flex;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(12px, 2vh, 24px);
      overflow: hidden;
    }

    .wheel-heading {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .wheel-heading h2, .options-heading h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .canvas-wrap {
      position: relative;
      width: min(100%, 430px, calc(100dvh - 410px));
      aspect-ratio: 1;
      margin: 0 auto 10px;
    }

    canvas { display: block; width: 100%; height: 100%; }

    .spin-button {
      width: min(100%, 310px);
      min-height: 54px;
      border: 0;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(105deg, #806df6, #6049df);
      box-shadow: 0 9px 18px rgba(100, 76, 226, .25);
      cursor: pointer;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.02em;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }

    .spin-button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 22px rgba(100, 76, 226, .32);
    }
    .spin-button:active:not(:disabled) { transform: translateY(0); }
    .spin-button:disabled { cursor: wait; opacity: .72; }

    .hint {
      margin: 11px 0 0;
      color: #999daf;
      font-size: 11px;
      text-align: center;
    }

    .options-card {
      display: flex;
      min-height: 0;
      flex-direction: column;
      padding: clamp(14px, 2.5vh, 25px) clamp(14px, 2.2vw, 23px);
    }
    .options-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }
    .options-heading h2 { font-size: 17px; }
    .options-heading span {
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    .options-description {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .preset-form {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .preset-select {
      min-width: 0;
      height: 42px;
      flex: 1;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      color: #555a70;
      background: #fbfbfd;
      font-size: 12px;
    }
    .preset-select:focus {
      border-color: #a99cff;
      box-shadow: 0 0 0 3px #806df61a;
    }

    .preset-button {
      min-width: 66px;
      padding: 0 13px;
      border: 1px solid #e5e0ff;
      border-radius: 11px;
      color: #6550d8;
      background: #f5f2ff;
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
      transition: background .18s, transform .18s;
    }
    .preset-button:hover:not(:disabled) { transform: translateY(-1px); background: #ece8ff; }
    .preset-button:disabled { cursor: wait; opacity: .6; }

    .preset-note {
      margin: -5px 0 13px;
      color: #999daf;
      font-size: 10px;
      line-height: 1.5;
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 13px;
    }

    .add-form input {
      width: 0;
      min-width: 0;
      flex: 1;
      height: 43px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      color: var(--ink);
      background: #fbfbfd;
      font-size: 13px;
      transition: border-color .18s, box-shadow .18s;
    }
    .add-form input::placeholder { color: #a5a8b8; }
    .add-form input:focus {
      border-color: #a99cff;
      box-shadow: 0 0 0 3px #806df61a;
    }

    .add-button {
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      border: 0;
      border-radius: 12px;
      color: white;
      background: #6d57e8;
      cursor: pointer;
      font-size: 22px;
      line-height: 1;
      transition: background .18s, transform .18s;
    }
    .add-button:hover { transform: translateY(-1px); background: #5942d5; }

    .option-list {
      display: flex;
      min-height: 0;
      flex: 1;
      flex-direction: column;
      gap: 7px;
      margin: 0;
      padding: 0 3px 0 0;
      overflow-y: auto;
      list-style: none;
      scrollbar-color: #d9d6ed transparent;
      scrollbar-width: thin;
    }

    .option-item {
      display: flex;
      min-height: 43px;
      align-items: center;
      gap: 10px;
      padding: 0 9px 0 12px;
      border: 1px solid #f0f0f5;
      border-radius: 12px;
      background: #fff;
      animation: appear .18s ease-out;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .option-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 9px;
      border-radius: 50%;
    }
    .option-name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      color: #34384c;
      font-size: 13px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .weight-control {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 5px;
      color: #8b8fa2;
      font-size: 10px;
      font-weight: 650;
    }
    .weight-input {
      width: 44px;
      height: 30px;
      padding: 0 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      outline: none;
      color: #5c46d7;
      background: #fbfbfd;
      font-size: 12px;
      font-weight: 750;
      text-align: center;
    }
    .weight-input:focus {
      border-color: #a99cff;
      box-shadow: 0 0 0 2px #806df61a;
    }
    .remove-button {
      display: grid;
      width: 28px;
      height: 28px;
      flex: 0 0 28px;
      place-items: center;
      border: 0;
      border-radius: 8px;
      color: #a3a6b5;
      background: transparent;
      cursor: pointer;
      font-size: 17px;
      transition: color .15s, background .15s;
    }
    .remove-button:hover { color: #df5367; background: #fff0f2; }

    .empty-list {
      padding: 25px 12px;
      border: 1px dashed #dedfea;
      border-radius: 12px;
      color: #999daf;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .result-dialog {
      width: min(390px, calc(100% - 32px));
      padding: 33px 28px 25px;
      border: 1px solid #e8e2ff;
      border-radius: 24px;
      color: var(--ink);
      background: linear-gradient(145deg, #fff, #f7f4ff);
      box-shadow: 0 24px 80px rgba(31, 25, 72, .25);
      text-align: center;
    }
    .result-dialog[open] { animation: appear .25s ease-out; }
    .result-dialog::backdrop {
      background: rgba(30, 27, 49, .48);
      backdrop-filter: blur(4px);
    }
    .result-label {
      margin-bottom: 10px;
      color: #8b7bbd;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
    }
    .result-name {
      margin-bottom: 25px;
      color: #5c46d7;
      font-size: clamp(28px, 8vw, 38px);
      font-weight: 850;
      letter-spacing: -.045em;
      overflow-wrap: anywhere;
    }
    .result-sparkle {
      margin-bottom: 12px;
      color: #7059e8;
      font-size: 30px;
    }
    .close-result {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(105deg, #806df6, #6049df);
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
    }

    .footer {
      margin-top: 18px;
      color: #a0a3b1;
      font-size: 11px;
      text-align: center;
    }
    button:focus-visible {
      outline: 3px solid #bdb4ff;
      outline-offset: 3px;
    }

    @media (max-width: 760px) {
      .app { width: min(560px, calc(100% - 28px)); }
      .workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 10px; }
      .wheel-card { padding: 10px 14px; }
      .canvas-wrap { width: min(54vw, 260px, 40dvh); margin-bottom: 6px; }
      .spin-button { min-height: 46px; }
      .hint { margin-top: 6px; }
      .options-card { padding: 12px 14px; }
      .options-description { display: none; }
      .preset-form { margin-bottom: 6px; }
      .preset-select, .preset-button { height: 38px; }
      .preset-note { margin: 0 0 7px; }
      .add-form { margin-bottom: 8px; }
      .add-form input, .add-button { height: 38px; }
      .add-button { width: 38px; flex-basis: 38px; }
      .option-list { max-height: none; }
      .option-item { min-height: 38px; }
      .topbar { min-height: 34px; }
      .brand-mark { width: 30px; height: 30px; }
      .footer { margin: 0; }
    }

    @media (max-width: 420px) {
      .top-note { font-size: 10px; }
      .intro p { font-size: 12px; }
      .canvas-wrap { width: min(58vw, 260px, 40dvh); }
      .wheel-heading h2 { font-size: 14px; }
      .spin-button { min-height: 42px; }
      .result-dialog { padding: 29px 22px 21px; }
    }

    @media (max-height: 700px) {
      .intro p, .footer, .options-description, .preset-note { display: none; }
      .app { gap: 5px; padding: 6px 0; }
      .eyebrow { margin-bottom: 2px; font-size: 10px; }
      h1 { font-size: clamp(22px, 4vh, 30px); }
      .workspace { gap: 8px; }
      .wheel-card { padding: 8px 12px; }
      .canvas-wrap { width: min(100%, 430px, calc(100dvh - 360px)); }
      .options-card { padding: 10px 12px; }
    }

    @media (max-width: 760px) and (max-height: 700px) {
      .workspace {
        grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr);
        grid-template-rows: minmax(0, 1fr);
        gap: 8px;
      }
      .wheel-card { padding: 8px; }
      .canvas-wrap { width: min(100%, 30dvh); }
      .options-card { padding: 8px; }
      .options-heading { margin-bottom: 4px; }
      .preset-form { gap: 4px; margin-bottom: 4px; }
      .preset-select, .preset-button { height: 34px; }
      .preset-select { padding: 0 6px; font-size: 11px; }
      .preset-button { min-width: 50px; padding: 0 8px; }
      .add-form { gap: 4px; margin-bottom: 5px; }
      .add-form input, .add-button { height: 36px; }
      .add-form input { padding: 0 8px; font-size: 11px; }
      .add-button { width: 36px; flex-basis: 36px; }
      .option-list { gap: 4px; }
      .option-item { min-height: 34px; gap: 5px; padding: 0 5px; }
      .option-dot { width: 7px; height: 7px; flex-basis: 7px; }
      .option-name { font-size: 11px; }
      .weight-control { gap: 0; font-size: 0; }
      .weight-input { width: 36px; height: 27px; font-size: 11px; }
      .remove-button { width: 24px; height: 24px; flex-basis: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span>오늘의 결정</div>
      <div class="top-note">고민은 룰렛에게 맡겨봐요</div>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <div class="eyebrow"><span aria-hidden="true">✧</span> EASY DECISION, HAPPY DAY</div>
      <h1 id="page-title">오늘 뭐 하지?</h1>
      <p>고민되는 선택지를 적고 룰렛을 돌려보세요.<br>오늘의 답을 바로 찾아드릴게요!</p>
    </section>

    <div class="workspace">
      <section class="card wheel-card" aria-labelledby="wheel-title">
        <div class="wheel-heading">
          <h2 id="wheel-title">행운의 룰렛</h2>
        </div>
        <div class="canvas-wrap">
          <canvas id="wheel" role="img" aria-label="후보를 보여주는 룰렛 원판"></canvas>
        </div>
        <button class="spin-button" id="spin-button" type="button">✦ &nbsp; 룰렛 돌리기</button>
        <p class="hint" id="wheel-hint">후보를 추가하면 룰렛을 돌릴 수 있어요</p>
      </section>

      <aside class="card options-card" aria-labelledby="options-title">
        <div class="options-heading">
          <h2 id="options-title">선택지</h2>
        </div>
        <p class="options-description">메뉴, 하고 싶은 일, 벌칙까지<br>고민되는 선택지를 자유롭게 추가해 보세요.</p>
        <form class="preset-form" id="preset-form">
          <label class="sr-only" for="preset-select">선택지 프리셋</label>
          <select class="preset-select" id="preset-select">
            <option value="" selected disabled>프리셋 선택</option>
            <option value="lunch">점심 메뉴</option>
            <option value="dinner">저녁 메뉴</option>
            <option value="snack">간식</option>
            <option value="activity">주말 활동</option>
            <option value="penalty">가벼운 벌칙</option>
          </select>
          <button class="preset-button" id="preset-apply" type="submit">적용</button>
        </form>
        <p class="preset-note">프리셋을 적용하면 현재 선택지가 교체됩니다.<br>당첨 기회가 높을수록 룰렛 칸이 커지고 더 잘 뽑혀요. (1~10)</p>
        <form class="add-form" id="add-form">
          <input id="option-input" type="text" maxlength="32" placeholder="예: 돈까스" autocomplete="off" aria-label="추가할 선택지">
          <button class="add-button" type="submit" aria-label="선택지 추가">+</button>
        </form>
        <ul class="option-list" id="option-list" aria-label="선택지 목록"></ul>
      </aside>
    </div>
    <footer class="footer">선택지를 더하거나 빼서 나만의 룰렛을 만들어보세요</footer>
  </main>
  <dialog class="result-dialog" id="result-dialog" aria-labelledby="result-label">
    <div class="result-sparkle" aria-hidden="true">✦</div>
    <div class="result-label" id="result-label">오늘의 선택</div>
    <div class="result-name" id="result-name" aria-live="polite"></div>
    <button class="close-result" id="close-result" type="button">확인</button>
  </dialog>

  <script>
    (() => {
      const colors = ["#8371f5", "#ff9b79", "#54c4ad", "#f5c454", "#6ba9ee", "#ed7da1", "#68c9d3", "#a58ae8", "#f18c68", "#70bd84", "#edbb69", "#7593e8"];
    const presets = {
      lunch: ["김치찌개", "돈까스", "마라탕", "초밥", "파스타", "햄버거"],
      dinner: ["치킨", "피자", "삼겹살", "부대찌개", "쌀국수", "회"],
      snack: ["떡볶이", "붕어빵", "아이스크림", "와플", "핫도그", "과일"],
      activity: ["산책하기", "영화 보기", "카페 가기", "보드게임", "자전거 타기", "집에서 쉬기"],
      penalty: ["애교 부리기", "노래 한 소절 부르기", "웃긴 표정 짓기", "칭찬 한마디 하기", "물 한 컵 마시기", "다음 게임 응원하기"]
    };
    let options = ["김치찌개", "돈까스", "마라탕", "초밥", "파스타", "햄버거"].map(name => ({ name, weight: 1 }));
      let rotation = 0;
      let spinning = false;

      const canvas = document.getElementById("wheel");
      const ctx = canvas.getContext("2d");
      const list = document.getElementById("option-list");
      const input = document.getElementById("option-input");
      const presetSelect = document.getElementById("preset-select");
      const presetApplyButton = document.getElementById("preset-apply");
      const spinButton = document.getElementById("spin-button");
      const resultDialog = document.getElementById("result-dialog");
      const resultName = document.getElementById("result-name");
      const hint = document.getElementById("wheel-hint");

      function renderList() {
        list.replaceChildren();
        options.forEach((option, index) => {
          const item = document.createElement("li");
          item.className = "option-item";

          const dot = document.createElement("span");
          dot.className = "option-dot";
          dot.style.backgroundColor = colors[index % colors.length];
          dot.setAttribute("aria-hidden", "true");

          const name = document.createElement("span");
          name.className = "option-name";
          name.textContent = option.name;

          const weightLabel = document.createElement("label");
          weightLabel.className = "weight-control";
          weightLabel.textContent = "당첨 기회";

          const weightInput = document.createElement("input");
          weightInput.className = "weight-input";
          weightInput.type = "number";
          weightInput.min = "1";
          weightInput.max = "10";
          weightInput.step = "1";
          weightInput.value = option.weight;
          weightInput.disabled = spinning;
          weightInput.setAttribute("aria-label", `${option.name} 당첨 기회 (1~10)`);
          weightInput.addEventListener("change", () => {
            const value = Number(weightInput.value);
            option.weight = Math.min(10, Math.max(1, Number.isFinite(value) ? Math.round(value) : 1));
            weightInput.value = option.weight;
            drawWheel();
          });
          weightLabel.append(weightInput);

          const remove = document.createElement("button");
          remove.className = "remove-button";
          remove.type = "button";
          remove.textContent = "×";
          remove.disabled = spinning;
          remove.setAttribute("aria-label", `${option.name} 삭제`);
          remove.addEventListener("click", () => {
            options.splice(index, 1);
            render();
          });

          item.append(dot, name, weightLabel, remove);
          list.append(item);
        });

        if (options.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty-list";
          empty.textContent = "아직 선택지가 없어요. 위에서 첫 번째 후보를 추가해 보세요!";
          list.append(empty);
        }
      }

      function render() {
        renderList();
        spinButton.disabled = spinning || options.length === 0;
        spinButton.textContent = spinning ? "✦   룰렛이 돌아가고 있어요..." : "✦   룰렛 돌리기";
        input.disabled = spinning;
        document.querySelector(".add-button").disabled = spinning;
        presetSelect.disabled = spinning;
        presetApplyButton.disabled = spinning;
        hint.textContent = spinning
          ? "룰렛이 멈출 때까지 잠시 기다려 주세요"
          : options.length
            ? "룰렛을 돌려 결과를 확인해 보세요"
            : "후보를 추가하면 룰렛을 돌릴 수 있어요";
        drawWheel();
      }

      function drawWheel() {
        const bounds = canvas.getBoundingClientRect();
        if (!bounds.width || !bounds.height) return;
        const dpr = Math.max(1, window.devicePixelRatio || 1);
        const pixelWidth = Math.round(bounds.width * dpr);
        const pixelHeight = Math.round(bounds.height * dpr);
        if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
          canvas.width = pixelWidth;
          canvas.height = pixelHeight;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const size = bounds.width;
        const center = size / 2;
        const radius = size * .445;
        ctx.clearRect(0, 0, size, size);

        ctx.beginPath();
        ctx.arc(center, center, radius + 5, 0, Math.PI * 2);
        ctx.fillStyle = "#f0eefb";
        ctx.fill();

        if (!options.length) {
          ctx.beginPath();
          ctx.arc(center, center, radius, 0, Math.PI * 2);
          ctx.fillStyle = "#f2f1f8";
          ctx.fill();
          ctx.fillStyle = "#989bad";
          ctx.font = `600 ${Math.max(12, size * .045)}px sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("선택지를 추가해 주세요", center, center);
          drawPointer(center, radius, size);
          return;
        }

        const totalWeight = options.reduce((total, option) => total + option.weight, 0);
        let accumulatedWeight = 0;
        options.forEach((option, index) => {
          const start = rotation + accumulatedWeight / totalWeight * Math.PI * 2 - Math.PI / 2;
          accumulatedWeight += option.weight;
          const end = rotation + accumulatedWeight / totalWeight * Math.PI * 2 - Math.PI / 2;
          ctx.beginPath();
          ctx.moveTo(center, center);
          ctx.arc(center, center, radius, start, end);
          ctx.closePath();
          ctx.fillStyle = colors[index % colors.length];
          ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,.88)";
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.save();
          ctx.translate(center, center);
          ctx.rotate((start + end) / 2);
          ctx.textAlign = "right";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#fff";
          ctx.shadowColor = "rgba(37,31,81,.18)";
          ctx.shadowBlur = 2;
          const fontSize = Math.max(10, Math.min(15, size * .038));
          ctx.font = `700 ${fontSize}px sans-serif`;
          const maxWidth = radius * .68;
          let label = option.name;
          while (ctx.measureText(label).width > maxWidth && label.length > 1) label = `${label.slice(0, -1)}…`;
          ctx.fillText(label, radius * .79, 0);
          ctx.restore();
        });

        ctx.beginPath();
        ctx.arc(center, center, size * .062, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.shadowColor = "rgba(42,35,87,.2)";
        ctx.shadowBlur = 9;
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(center, center, size * .036, 0, Math.PI * 2);
        ctx.fillStyle = "#6c56e8";
        ctx.fill();
        drawPointer(center, radius, size);
      }

      function drawPointer(center, radius, size) {
        ctx.save();
        ctx.translate(center, center - radius + 1);
        ctx.beginPath();
        ctx.moveTo(-size * .043, -size * .023);
        ctx.lineTo(size * .043, -size * .023);
        ctx.lineTo(0, size * .058);
        ctx.closePath();
        ctx.fillStyle = "#fff";
        ctx.shadowColor = "rgba(40,34,83,.28)";
        ctx.shadowBlur = 7;
        ctx.fill();
        ctx.restore();
      }

      document.getElementById("add-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const value = input.value.trim();
        if (!value || spinning) return;
        options.push({ name: value, weight: 1 });
        input.value = "";
        render();
        input.focus();
      });

      document.getElementById("preset-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const selectedPreset = presets[presetSelect.value];
        if (!selectedPreset || spinning) return;
        options = selectedPreset.map(name => ({ name, weight: 1 }));
        rotation = 0;
        presetSelect.value = "";
        render();
      });

      spinButton.addEventListener("click", () => {
        if (spinning || options.length === 0) return;
        spinning = true;
        render();

        const totalWeight = options.reduce((total, option) => total + option.weight, 0);
        let randomWeight = Math.random() * totalWeight;
        let selectedIndex = options.findIndex(option => {
          randomWeight -= option.weight;
          return randomWeight < 0;
        });
        if (selectedIndex === -1) selectedIndex = options.length - 1;
        const selectedWeightMidpoint = options
          .slice(0, selectedIndex)
          .reduce((total, option) => total + option.weight, 0) + options[selectedIndex].weight / 2;
        const desiredRotation = -selectedWeightMidpoint / totalWeight * Math.PI * 2;
        const extraTurn = ((desiredRotation - rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
        const startRotation = rotation;
        const endRotation = rotation + Math.PI * 2 * (5 + Math.floor(Math.random() * 3)) + extraTurn;
        const duration = 5000;
        let elapsed = 0;
        let previousFrameTime = null;

        function animate(now) {
          if (previousFrameTime !== null) {
            elapsed += Math.min(now - previousFrameTime, 50);
          }
          previousFrameTime = now;
          const progress = Math.min(1, elapsed / duration);
          const eased = 1 - Math.pow(1 - progress, 4);
          rotation = startRotation + (endRotation - startRotation) * eased;
          drawWheel();
          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            rotation = endRotation % (Math.PI * 2);
            spinning = false;
            resultName.textContent = options[selectedIndex].name;
            resultDialog.showModal();
            render();
          }
        }
        requestAnimationFrame(animate);
      });

      document.getElementById("close-result").addEventListener("click", () => resultDialog.close());
      window.addEventListener("resize", drawWheel);
      render();
    })();
  </script>
</body>
</html>
